# Scheduled + on-demand web crawl, with results delivered to Google Drive.
#
# - Runs automatically every Monday at 06:00 UTC.
# - Or trigger manually from the repo's Actions tab ("Run workflow") with your
#   own seed URLs and page budget — works from the GitHub mobile app.
# - Results are committed to the `crawl-data` branch (timestamped files).
#   Muse picks them up from there and delivers them to the "NOVA crawls"
#   Google Drive folder automatically — no setup needed on your side.
# - Results are also kept as a workflow artifact for 30 days as a backup.
#
# Install: upload this file to .github/workflows/ in the repo (GitHub web UI:
# Add file -> Upload files, or open the existing file -> edit -> paste -> commit).

name: Scheduled crawl

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seed URLs (space-separated)"
        required: true
        default: "https://en.wikipedia.org/wiki/Artificial_intelligence"
      max_pages:
        description: "Max pages to crawl"
        required: false
        default: "500"

permissions:
  contents: write  # needed to publish results to the crawl-data branch

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Crawl
        env:
          NOVA_CRAWLERS_MAX_PAGES_TOTAL: ${{ inputs.max_pages || '2000' }}
        run: |
          mkdir -p crawl-out
          python -m nova.crawlers.runner \
            --config configs/config.yaml \
            --out crawl-out \
            ${{ inputs.seeds || 'https://en.wikipedia.org/wiki/Artificial_intelligence https://arxiv.org/ https://docs.python.org/3/' }}

      - name: Upload results (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results
          path: |
            crawl-out/crawl.jsonl
            crawl-out/dead_letter.jsonl
          retention-days: 30

      - name: Publish results to crawl-data branch
        run: |
          set -e
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          git config user.name "nova-crawler"
          git config user.email "nova-crawler@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin crawl-data >/dev/null 2>&1; then
            git fetch origin crawl-data:crawl-data
            git checkout crawl-data
          else
            git checkout --orphan crawl-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$GITHUB_WORKSPACE/crawl-out/crawl.jsonl" "crawl-${TS}.jsonl"
          if [ -f "$GITHUB_WORKSPACE/crawl-out/dead_letter.jsonl" ]; then
            cp "$GITHUB_WORKSPACE/crawl-out/dead_letter.jsonl" "dead_letter-${TS}.jsonl"
          fi
          git add "crawl-${TS}.jsonl" "dead_letter-${TS}.jsonl" 2>/dev/null || git add "crawl-${TS}.jsonl"
          git commit -m "crawl results ${TS}" || echo "nothing to commit"
          git push origin crawl-data
