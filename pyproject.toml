[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai-infrastructure"
version = "0.1.0"
description = "Secure, modular AI infrastructure for the NOVA model: sandboxed web access, crawlers, dataset curation, teacher integration, training and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All rights reserved" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
